# Blueprint pro Render.com
# Hobby setup: use only Render's free service and database plans.
# Region is omitted so an existing service keeps its current region.
services:
  - type: web
    name: trafficcounters
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn trafficcounters.wsgi:application --bind 0.0.0.0:$PORT --log-file -"
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: trafficcounters-db
          property: connectionString

databases:
  - name: trafficcounters-db
    plan: free
