{% extends 'counters/base.html' %}

{% block title %}Přihlášení{% endblock %}

{% block content %}
<h2 class="content-heading">Přihlášení</h2>
<p class="page-intro">
    Přístup mají pouze zaměstnanci firmy.
</p>

{% if form.errors %}
<p class="login-error">Nesprávné uživatelské jméno nebo heslo.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    <label for="id_username">Uživatelské jméno</label>
    <input type="text" name="username" id="id_username" autofocus required>

    <label for="id_password">Heslo</label>
    <input type="password" name="password" id="id_password" required>

    <input type="hidden" name="next" value="{{ next }}">

    <button type="submit" class="btn login-submit">Přihlásit se</button>
</form>
{% endblock %}
